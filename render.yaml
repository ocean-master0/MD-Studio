services:
  - type: web
    name: md-studio
    env: static
    buildCommand: echo "Static site — no build required"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
    routes:
      - type: rewrite
        source: /
        destination: /index.html
